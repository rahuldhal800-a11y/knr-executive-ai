<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#09090b"><meta name="description" content="AEGIS Mobile — local browser AI with explicit camera and microphone permissions."><link rel="manifest" href="./manifest.json"><title>AEGIS Mobile</title>
<style>:root{color-scheme:dark;font-family:system-ui,-apple-system,Segoe UI,sans-serif}body{margin:0;background:#09090b;color:#f4f4f5}main{max-width:760px;margin:auto;padding:20px 16px 40px}.card{background:#18181b;border:1px solid #27272a;border-radius:18px;padding:16px;margin:12px 0}h1{margin:0 0 6px;font-size:28px}.muted{color:#a1a1aa;font-size:14px}.row{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid #3f3f46;background:#27272a;color:#fff;border-radius:12px;padding:11px 14px;font-weight:600}button:disabled{opacity:.45}#chat{height:360px;overflow:auto;display:flex;flex-direction:column;gap:8px}.msg{padding:10px 12px;border-radius:12px;white-space:pre-wrap}.ai{background:#27272a}.user{background:#3f3f46;align-self:flex-end;max-width:85%}input{flex:1;min-width:180px;padding:12px;border-radius:12px;border:1px solid #3f3f46;background:#09090b;color:#fff}video{width:100%;max-height:320px;border-radius:14px;margin-top:10px;display:none}progress{width:100%;height:10px}</style>
</head><body><main><section class="card"><h1>⚡ AEGIS Mobile</h1><div class="muted">Local browser AI experiment • no OpenAI/Anthropic/Gemini API key</div><p id="modelStatus" class="muted">Model not loaded.</p><progress id="progress" max="1" value="0"></progress><div class="row" style="margin-top:10px"><button id="load">Load local brain</button><button id="install" hidden>Install app</button></div></section><section class="card"><div id="chat"></div><div class="row" style="margin-top:10px"><input id="input" autocomplete="off" placeholder="Ask AEGIS…"><button id="send">Send</button></div></section><section class="card"><strong>Device permissions</strong><p id="device" class="muted">Camera/microphone are off until you explicitly grant them.</p><div class="row"><button id="cam">Camera + mic</button><button id="mic">Microphone</button><button id="stop">Stop</button></div><video id="video" autoplay playsinline muted></video></section></main><script type="module" src="./app.js?v=4"></script></body></html>
