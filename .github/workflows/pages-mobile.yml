name: Deploy AEGIS Mobile
on:
  push:
    branches: [aegis-mobile-no-api]
    paths: [mobile/**, .github/workflows/pages-mobile.yml]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v4
        with:
          path: mobile
      - id: deployment
        uses: actions/deploy-pages@v4
