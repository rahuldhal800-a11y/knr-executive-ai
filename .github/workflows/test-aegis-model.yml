name: Test AEGIS model

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install model dependency
        run: python -m pip install --upgrade pip && pip install -r training/requirements-from-scratch.txt pytest numpy
      - name: Run AEGIS model tests
        run: python -m pytest -q tests/test_aegis_model.py tests/test_1t_config.py
